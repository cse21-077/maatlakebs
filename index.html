<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maatla Kebs | Premium Copy Trader</title>
    <meta name="description"
        content="Securely manage your copy-trading preferences with Maatla Kebs. Experience high-performance synthetic index trading.">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#0d0f14">
    <meta name="msapplication-TileColor" content="#0d0f14">
    <meta name="msapplication-navbutton-color" content="#0d0f14">

    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maatla Kebs">
    <link rel="apple-touch-icon" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-512.png">

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="shortcut icon" href="/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
        // Service Worker Registration with Update Detection
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('[PWA] Service Worker registered successfully');

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available
                                    if (confirm('New version available! Reload to update?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.log('[PWA] Service Worker registration failed:', err);
                    });

                // Reload page when new service worker takes control
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            });
        }
    </script>
</body>

</html>
